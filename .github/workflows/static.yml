# Build the Flutter Web app and deploy it to GitHub Pages
name: Deploy Flutter Web to Pages

# 배포는 Vercel 이 main 푸시 때 자동으로 한다. 이 레포는 GitHub Pages 가 꺼져 있어
# push 때마다 돌면 'Get Pages site failed' 로 실패하므로, 필요할 때 Actions 탭에서 직접 실행만 한다.
# (Pages 를 쓰려면: Settings → Pages → Source 를 'GitHub Actions' 로 바꾼 뒤 실행)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Build web
        run: |
          flutter pub get
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './flutter_app/build/web'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
