# push·PR 마다 자동 테스트: 서버(api/_core.js) 단위 테스트 + 앱(Flutter) 분석·테스트
# OpenAI 는 실제로 부르지 않는다 (테스트가 가짜 응답을 쓴다) → API 키·비용 없음
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: 서버 테스트 (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  app:
    name: 앱 분석·테스트 (flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
